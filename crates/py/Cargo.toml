[package]
name = "openjiuwen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "L5 PyO3 绑定：把 Rust 内核导出为原生扩展 _openjiuwen"

[lib]
name = "_openjiuwen"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
openjiuwen-protocol.workspace = true
openjiuwen-state.workspace = true
openjiuwen-algorithms = { workspace = true }
openjiuwen-runtime = { workspace = true }
pyo3 = { workspace = true }

[build-dependencies]
pyo3-build-config = "0.23"
